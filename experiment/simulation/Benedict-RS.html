<script>

var step=0;

function step1()
{
	$("#regC").addClass("dsphdd");
	$("#step1").addClass("dsphdd");
	$("#regO").removeClass("dsphdd");
	setTimeout(function() {
	  $("#PPT0").addClass("dsphdd");
	}, 400);
	setTimeout(function() {
	  $("#PPT1").removeClass("dsphdd");
	}, 600);
	setTimeout(function() {
	  $("#push2").removeClass("dsphdd");
	}, 1000);
	setTimeout(function() {
	  $("#push2").addClass("dsphdd");
	}, 1800);
	setTimeout(function() {
	  $("#PPT1").addClass("dsphdd");
	  $("#PPT2").removeClass("dsphdd");
	}, 2100);
	setTimeout(function() {
	  $("#push1").removeClass("dsphdd");
	  $("#drop").removeClass("dsphdd");
	}, 2500);
	setTimeout(function() {
	  $("#TBblk").addClass("dsphdd");
	  $("#out0").removeClass("dsphdd");
	  $("#push1").addClass("dsphdd");
	  $("#PPT2").addClass("dsphdd");
	  $("#PPT0a").removeClass("dsphdd");
	  $("#drop").addClass("dsphdd");
	}, 3300);
	setTimeout(function() {
	  $("#PPT0a").addClass("dsphdd");
	  $("#PPT0").removeClass("dsphdd");
	  $("#masteps").text("Now, add 5mL of the sample solution to the test tube. To do this, click on the sample beaker.");
	}, 3700);
	step=1;
}


function step2()
{
	if (step==1) 
	{
	$("#PPT0").addClass("dsphdd");
	$("#PPT0b").removeClass("dsphdd");

	setTimeout(function() {
	  $("#push3").removeClass("dsphdd");
	}, 400);
	setTimeout(function() {
	  $("#PPT0b").addClass("dsphdd");
	  $("#PPT3").removeClass("dsphdd");
	  $("#push3").addClass("dsphdd");
	}, 1000);
	setTimeout(function() {
	  $("#PPT3").addClass("dsphdd");
	  $("#PPT3X").removeClass("dsphdd");
	}, 1800);
	setTimeout(function() {
	  $("#push1").removeClass("dsphdd");
	  $("#drop").removeClass("dsphdd");
	}, 2400);
	setTimeout(function() {
	  $("#out0").addClass("dsphdd");
	  $("#out01").removeClass("dsphdd");
	  $("#push1").addClass("dsphdd");
	  $("#drop").addClass("dsphdd");
	  $("#PPT3X").addClass("dsphdd");
	  $("#PPT0a").removeClass("dsphdd");
	}, 3200);
	setTimeout(function() {
	  $("#PPT0a").addClass("dsphdd");
	  $("#PPT0").removeClass("dsphdd");
	  $("#masteps").text("Now, click on the test tube to mix the solution thoroughly, then place it on the burner to heat the sample over a flame upto 5 minuts.");
	}, 3500);
	
	step=2;
	}
}

function step3()
{
	var reslt = Math.floor(Math.random() * 3) + 2;
	if (step==2) 
	{
	$("#out01").addClass("animate");

	setTimeout(function() {
		$("#out01").removeClass("animate");
	}, 1200);
	setTimeout(function() {
		$("#out01").fadeOut(800, function () {
                $(this).addClass("dsphdd");
            });
        $("#out1X").removeClass("dsphdd").hide().fadeIn(800);

	}, 1300);
	setTimeout(function() {
	  $("#out1X").addClass("dsphdd");
	  $("#out1").removeClass("dsphdd");
	}, 3000);
	setTimeout(function() {
	  $("#out1").addClass("animate");
	}, 3800);
	setTimeout(function() {
	  $("#out1").removeClass("animate");
	}, 5000);

	setTimeout(function() {
		$("#out1").fadeOut(800, function () {
                $(this).addClass("dsphdd");
            });
        $("#out"+reslt).removeClass("dsphdd").hide().fadeIn(800);

    $("#nextstep").removeClass("dsphdd");
    $("#masteps").text("Now, click on the Result Analysis button to view the interpretation of results.");

	}, 5500);

	
	step=3;
	}
}


</script>
