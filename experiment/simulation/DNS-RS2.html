<script>

var step=0;

function step1()
{
	$("#xxx").addClass("dsphdd");
	$("#yyy").removeClass("dsphdd");
	$(".bwl").removeClass("dsphdd");
	setTimeout(function() {
	$(".bwl").fadeOut(800, function () {
            $(this).addClass("dsphdd");
        });
    $(".awl").removeClass("dsphdd").hide().fadeIn(800);

	}, 4000);

	setTimeout(function() {

		$(".awl").addClass("dsphdd");
		$("#yyy").addClass("dsphdd");
		$("#zzz").removeClass("dsphdd");

	}, 7000);

	setTimeout(function() {
		$("#masteps").text("After, click on the 40% Rochelle Salt solution to add 1ml of it to the test tube sample.");
	}, 11000);

	
	
	step=1;
}

function step2()
{
	if (step==1) 
	{
		$("#PPT08").addClass("dsphdd");
		$("#PPT07").removeClass("dsphdd");
		setTimeout(function() {
			$("#push7").removeClass("dsphdd");
		}, 400);
		setTimeout(function() {
			$("#push7").addClass("dsphdd");
		}, 1000);
		setTimeout(function() {
			$("#PPT07").addClass("dsphdd");
			$("#pt1").removeClass("dsphdd");
		}, 1400);
		setTimeout(function() {
			$("#push1").removeClass("dsphdd");
		}, 1800);
		setTimeout(function() {
			$("#push1").addClass("dsphdd");
			$("#pt1").addClass("dsphdd");
			$("#ppt1").removeClass("dsphdd");
			$("#zzz").addClass("dsphdd");
			$("#fc1").removeClass("dsphdd");
		}, 2600);
		setTimeout(function() {
			$("#ppt1").addClass("dsphdd");
			$("#PPT08").removeClass("dsphdd");
			$("#runx").removeClass("dsphdd");
			$("#masteps").text("Now, click on the Run button to add 40% Rochelle Salt solution to the remaining test tubes as specified in the table.");
		}, 3000);
	
	step=2;
	}
}



function run() 
{
	$("#runx").addClass("dsphdd");
if(step==2)
{
    for (let i = 0; i < 5; i++) 
    {
        (function(i) {
            setTimeout(function() {
                
       			$("#PPT08").addClass("dsphdd");
				$("#PPT07").removeClass("dsphdd");
				setTimeout(function() {
					$("#push7").removeClass("dsphdd");
				}, 400);
				setTimeout(function() {
					$("#push7").addClass("dsphdd");
				}, 1000);
				setTimeout(function() {
					$("#PPT07").addClass("dsphdd");
					$("#pt"+(i+2)).removeClass("dsphdd");
				}, 1400);
				setTimeout(function() {
					$("#push"+(i+2)).removeClass("dsphdd");
				}, 1800);
				setTimeout(function() {
					$("#push"+(i+2)).addClass("dsphdd");
					$("#pt"+(i+2)).addClass("dsphdd");
					$("#ppt"+(i+2)).removeClass("dsphdd");
					$("#fc"+(i+1)).addClass("dsphdd");
					$("#fc"+(i+2)).removeClass("dsphdd");
				}, 2600);
				setTimeout(function() {
					$("#ppt"+(i+2)).addClass("dsphdd");
				}, 3000);
	
	

            }, i * 3000); // Delay in milliseconds (27,200 ms)

        })(i);
    }

    setTimeout(function() {
    	$("#nextstep").removeClass("dsphdd");
		$("#masteps").text("To proceed further click on next step.");
	}, 15000);

 	step=3;
}





}
