<script>

var step=0;

function step1()
{
	$("#PPTblkN").addClass("dsphdd");
	$("#step1").addClass("dsphdd");
	$("#PPTblk").removeClass("dsphdd");
	setTimeout(function() {
	  $("#push1").removeClass("dsphdd");
	}, 200);
	setTimeout(function() {
	  $("#PPTblk").addClass("dsphdd");
	  $("#PPT10").removeClass("dsphdd");
	}, 1000);
	setTimeout(function() {
	  $("#push1").addClass("dsphdd");
	}, 1200);

	setTimeout(function() {
	  $("#PPT10").addClass("dsphdd");
	}, 1500);
	setTimeout(function() {
	  $("#PPT11").removeClass("dsphdd");
	}, 1800);
	setTimeout(function() {
	  $("#push4").removeClass("dsphdd");
	  $("#drop").removeClass("dsphdd");
	}, 2600);
	setTimeout(function() {
	  $("#TBblk").removeClass("dsphdd");
	  $("#drop").removeClass("dsphdd");
	}, 2800);
	setTimeout(function() {
	  $("#TBblk").addClass("dsphdd");
	  $("#TB1").removeClass("dsphdd");
	  $("#drop").addClass("dsphdd");
	  $("#PPT11").addClass("dsphdd");
	  $("#push4").addClass("dsphdd");
	}, 3500);
	setTimeout(function() {
	  $("#PPTblkN").removeClass("dsphdd");
	  $("#masteps").text("Next, add 2-3 drops of Alpha-Naphthol to the sample. To do this, click on the Alpha-Naphthol bottle.");
	}, 3700);

	step=1;
}

function step2()
{
	if (step==1) 
	{
	 $("#PPTblkN").addClass("dsphdd");
	setTimeout(function() {
	  $("#BTL1C").addClass("dsphdd");
	  $("#BTL1O").removeClass("dsphdd");
	}, 200);
	// setTimeout(function() {
	//   $("#PPT10").addClass("dsphdd");
	// }, 400);
	setTimeout(function() {
	  $("#PPThlf").removeClass("dsphdd");
	  $("#push2").removeClass("dsphdd");
	}, 600);
	setTimeout(function() {
	  $("#push2").addClass("dsphdd");
	}, 1500);


	setTimeout(function() {
	  $("#PPThlf").addClass("dsphdd");
	  $("#PPT10").addClass("dsphdd");
	}, 2000);
	setTimeout(function() {
	  $("#PPT11").removeClass("dsphdd");
	}, 2300);
	setTimeout(function() {
	  $("#push4").removeClass("dsphdd");
	  $("#drop").removeClass("dsphdd");
	}, 3100);
	setTimeout(function() {
	  $("#drop").addClass("dsphdd");
	  $("#PPT11").addClass("dsphdd");
	  $("#push4").addClass("dsphdd");
	}, 3600);
	setTimeout(function() {
	  $("#PPTblkN").removeClass("dsphdd");
	  $("#masteps").text("Now, click on the test tube to mix the solution thoroughly.");
	}, 4200);

	step=2;
	}
}


function step3()
{
	if (step==2) 
	{
		$("#TB1").addClass("animate");
		setTimeout(function() {
		  $("#TB1").removeClass("animate");
		}, 1500);

		$("#masteps").text("Now, click on the sulfuric acid bottle to carefully add 2 mL of it to the solution in the test tube.");
		step=3;
	}
}



function step4()
{
	if (step==3) 
	{
	 
	 $("#BTL2C").addClass("dsphdd");
	 $("#BTL2O").removeClass("dsphdd");
	setTimeout(function() {
	  $("#TB1").addClass("dsphdd");
	  $("#TB21").removeClass("dsphdd");
	}, 500);
	setTimeout(function() {
	  $("#PPTblkN").addClass("dsphdd");
	}, 1200);
	  setTimeout(function() {
	  $("#PPThlfX").removeClass("dsphdd");
	  $("#push3").removeClass("dsphdd");
	}, 1600);

	setTimeout(function() {
	  $("#push3").addClass("dsphdd");
	  $("#PPThlfX").addClass("dsphdd");
	}, 2400);

	setTimeout(function() {
	  $("#PPT3").removeClass("dsphdd");
	}, 2500);

	setTimeout(function() {
	  $("#push5").removeClass("dsphdd");
	}, 3000);
	setTimeout(function() {
	  $("#TB21").addClass("dsphdd");
	  $("#TB22").removeClass("dsphdd");
	  $("#PPT3").addClass("dsphdd");
	  $("#PPTblkX").removeClass("dsphdd");
	  $("#push5").addClass("dsphdd");
	}, 3500);
	setTimeout(function() {
	  $("#PPTblkX").addClass("dsphdd");
	}, 4000);
	setTimeout(function() {
	  $("#TB22").addClass("dsphdd");
	  $("#TB31").removeClass("dsphdd");
	}, 4500);

	setTimeout(function () {
            $("#TB31").fadeOut(800, function () {
                $(this).addClass("dsphdd");
            });
            $("#TB32").removeClass("dsphdd").hide().fadeIn(800);
            $("#masteps").text("Now, check if a purple-colored ring has formed at the junction of the two layers. The appearance of this ring indicates the presence of carbohydrates in the solution.");
    }, 5300);

	step=4;
	}
}
