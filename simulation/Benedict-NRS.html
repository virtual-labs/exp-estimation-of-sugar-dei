{

		}, 2800);

	 }
}

function step3()
{

	{
		$("#out01").addClass("shake");
		setTimeout(function() {
		$("#out01").fadeOut(800, function () {
            $(this).addClass("dsphdd");
        });
        $("#out02").removeClass("dsphdd").hide().fadeIn(800);
		}, 2500);
		setTimeout(function() {
				$("#out02").addClass("dsphdd");
				$("#out02X").removeClass("dsphdd");
		}, 4000);

		setTimeout(function() {
				$("#out02").removeClass("dsphdd");
				$("#out02X").addClass("dsphdd");
				$("#masteps").text("Now, click on the NaOH bottle to add a few drops into the test tube.");
				
		}, 10000);

		step=3;
	}


	var reslt = Math.floor(Math.random() * 3) + 2;
	if (step==5) 
	{
		$("#out1").addClass("shake");
		setTimeout(function() {
		$("#out1").fadeOut(800, function () {
            $(this).addClass("dsphdd");
        });
        $("#out11").removeClass("dsphdd").hide().fadeIn(800);
		}, 2500);
		setTimeout(function() {
			$("#out11").addClass("dsphdd");
			$("#out11X").removeClass("dsphdd");
		}, 4000);
		
		setTimeout(function() {
		$("#out11X").fadeOut(800, function () {
            $(this).addClass("dsphdd");
        });
        $("#dtl"+reslt).removeClass("dsphdd").hide().fadeIn(800);
		}, 8000);

		setTimeout(function() {
			$("#dtl"+reslt).addClass("dsphdd");
			$("#dtlx"+reslt).removeClass("dsphdd");
			$("#nextstep").removeClass("dsphdd");
			$("#masteps").text("Now, click on the Result Analysis button to view the interpretation of results.");
		}, 10000);

		step=6;
	}



}
