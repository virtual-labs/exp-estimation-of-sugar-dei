<script>

var step=0;

function step1()
{
	$("#mpptstd").addClass("dsphdd");
	$("#mpptstd2").removeClass("dsphdd");
	$("#mppt1").removeClass("dsphdd");
	step=1;
	$("#masteps").text("Now, click on the micropipette wheel to set the volume to 1 mL.");
	
}

function step2()
{
	if (step==1) 
	{
		$(".red").text("1000.00");
		$("#red0").removeClass("dsphdd");
		$("#masteps").text("Now, click on the blank tube to add 1 mL of the solution into the cuvette.");
	step=2;
	}
}

function step3()
{
	if (step==2) 
	{
		$("#mppt1").addClass("dsphdd");
		$("#red0").addClass("dsphdd");
		$("#mpptd1").removeClass("dsphdd");
		$("#red1").removeClass("dsphdd");
		setTimeout(function() {
		  $("#mpptd1").addClass("dsphdd");
		  $("#mpptu1").removeClass("dsphdd");
		}, 800);
		setTimeout(function() {
		  $("#mpptu1").addClass("dsphdd");
		  $("#red1").addClass("dsphdd");
		  $("#red7").removeClass("dsphdd");
		  $("#mpptu7").removeClass("dsphdd");
		}, 1200);
		setTimeout(function() {
		  $("#mpptu7").addClass("dsphdd");
		  $("#mpptd7").removeClass("dsphdd");
		  $("#cublk").addClass("dsphdd");
		  $("#cub1").removeClass("dsphdd");
		}, 2000);
		setTimeout(function() {
		  $("#mpptd7").addClass("dsphdd");
		  $("#red7").addClass("dsphdd");
		  $("#mpptstd2").addClass("dsphdd");
		  $("#mpptstd").removeClass("dsphdd");
		  $('#masteps').text("Now, to take the absorbance reading, click on the spectrometer lid to open it and place the test sample inside.");
		}, 2500);


		
	step=3;
	}
}


function step4()
{
	if (step==3) 
	{
		$("#smtr1").addClass("dsphdd");
		$("#smtr2").removeClass("dsphdd");
		setTimeout(function() {
		  $("#cub1").addClass("dsphdd");
		  $("#smtr2").addClass("dsphdd");
		  $("#smtr3").removeClass("dsphdd");
		}, 800);
		setTimeout(function() {
		  $("#smtr3").addClass("dsphdd");
		  $("#smtr1").removeClass("dsphdd");
		  $('#masteps').text("Now, click on the A540 button on the spectrometer to set the absorbance reading to 540 nm.");
		}, 1600);
	}
	step=4;
}

function step5()
{
	if (step==4) 
	{
		$("#mode").removeClass("dsphdd");
		$('#masteps').text("Now, click on the Blank button on the spectrometer to set it to blank mode.");
	}
	step=5;
}

function step6()
{
	if (step==5) 
	{
		$("#result").text("B: ");
		$('#masteps').text("Now, click on Enter to measure the absorbance reading of the blank sample.");
	}
	step=6;
}


function step7()
{
	if (step==6) 
	{
		$("#result").text("B: 00.00");
		setTimeout(function() {
		  $("#cublk").removeClass("dsphdd");
		  $("#runx").removeClass("dsphdd");
		  $('#masteps').text("Now, click on the Run button to measure the absorbance readings of the remaining samples in the same way.");
		}, 2500);
	}
	step=7;
}



let TestData = [
				[1000.00,0.22],
				[1000.00,0.40],
				[1000.00,0.61],
				[1000.00,0.82],
				[1000.00,1.2],
				];

function run() {
	$("#runx").addClass("dsphdd");
    for (let i = 0; i < TestData.length; i++) 
    {
    	if (i==0) 
    	{
    		$("#mpptstd").addClass("dsphdd");
			$("#mpptstd2").removeClass("dsphdd");
    	}
    	$("#mppt1").removeClass("dsphdd");
        (function(i) {
            setTimeout(function() {

                setTimeout(() => {
                $(".red").text(TestData[i][0]);
				$("#red0").removeClass("dsphdd");
                }, 800);

                setTimeout(() => {
                $("#mppt1").addClass("dsphdd");
				$("#red0").addClass("dsphdd");
				$("#mpptd"+(i+2)).removeClass("dsphdd");
				$("#red"+(i+2)).removeClass("dsphdd");
                }, 1600);

				setTimeout(function() {
				  $("#mpptd"+(i+2)).addClass("dsphdd");
				  $("#mpptu"+(i+2)).removeClass("dsphdd");
				}, 2400);
				setTimeout(function() {
				  $("#mpptu"+(i+2)).addClass("dsphdd");
				  $("#red"+(i+2)).addClass("dsphdd");
				  $("#red7").removeClass("dsphdd");
				  $("#mpptu7").removeClass("dsphdd");
				}, 3200);
				setTimeout(function() {
				  $("#mpptu7").addClass("dsphdd");
				  $("#mpptd7").removeClass("dsphdd");
				  $("#cublk").addClass("dsphdd");
				  $("#cub"+(i+2)).removeClass("dsphdd");
				}, 4000);
				setTimeout(function() {
				  $("#mpptd7").addClass("dsphdd");
				  $("#red7").addClass("dsphdd");
				  $("#mppt1").removeClass("dsphdd");
				}, 4800);

				setTimeout(function() {
                $("#smtr1").addClass("dsphdd");
				$("#smtr2").removeClass("dsphdd");
				}, 5600);
       
				setTimeout(function() {
				  $("#cub"+(i+2)).addClass("dsphdd");
				  $("#smtr2").addClass("dsphdd");
				  $("#smtr3").removeClass("dsphdd");
				}, 6400);
				setTimeout(function() {
				  $("#smtr3").addClass("dsphdd");
				  $("#smtr1").removeClass("dsphdd");
				}, 7200);
				setTimeout(function() {
				  $("#result").text("T: "+ TestData[i][1]);
				}, 8000);
				setTimeout(function() {
				  $("#result").text("00.00");
				  $("#cublk").removeClass("dsphdd");
				}, 10000);
                
                

            }, i * 10300); // Delay in milliseconds (27,200 ms)
        })(i);


        setTimeout(() => {
                    $("#masteps").text("To proceed further, click on the next step.");
					$("#nextstep").removeClass("dsphdd");
                }, 51500);

    }
}




</script>
